<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 800" width="1800" height="800" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke" stroke="context-stroke"/></marker></defs>
<rect width="1800" height="800" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#000">TAGE detail</text>
<rect x="20" y="70" width="460" height="330" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="28" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">Inputs</text>
<rect x="520" y="70" width="800" height="330" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="528" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">Lookup in cycle n, answer in cycle n+1</text>
<rect x="1380" y="70" width="400" height="330" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="1388" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">Selection and metadata</text>
<rect x="20" y="440" width="1760" height="320" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="28" y="456" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">Training (at commit only)</text>
<path d="M460,140 L490,140 L540,140" fill="none" stroke="#6c8ebf" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M460,300 L500,300 L500,215 L540,215" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M900,140 L1330,140 L1400,140" fill="none" stroke="#6c8ebf" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1300,215 L1340,215 L1340,155 L1400,155" fill="none" stroke="#6c8ebf" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1580,200 L1580,220" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1580,300 L1580,320" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M250,250 L250,270" fill="none" stroke="#6c8ebf" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="110" width="420" height="60" rx="9.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="250.0" y="136" font-size="12" text-anchor="middle" fill="#000">Fetch PC</text>
<text x="250.0" y="152" font-size="12" text-anchor="middle" fill="#000">index uses pc[11:2], tag uses pc[19:12]</text>
<rect x="40" y="190" width="420" height="60" rx="9.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="250.0" y="216" font-size="12" text-anchor="middle" fill="#000">Global history register</text>
<text x="250.0" y="232" font-size="12" text-anchor="middle" fill="#000">64 bits, speculative copy plus retained copy</text>
<rect x="40" y="270" width="420" height="110" rx="16.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="250.0" y="306" font-size="12" text-anchor="middle" fill="#000">Registered folds</text>
<text x="250.0" y="322" font-size="12" text-anchor="middle" fill="#000">idx_fold_q[t] and tag_fold_q[t] per table</text>
<text x="250.0" y="336" font-size="12" text-anchor="middle" fill="#000">every candidate history is folded in parallel:</text>
<text x="250.0" y="352" font-size="12" text-anchor="middle" fill="#000">execute recovery, commit recovery, speculative shift</text>
<rect x="540" y="110" width="360" height="60" rx="9.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="720.0" y="136" font-size="12" text-anchor="middle" fill="#000">Base table</text>
<text x="720.0" y="152" font-size="12" text-anchor="middle" fill="#000">512-entry bimodal fallback</text>
<rect x="540" y="190" width="360" height="50" rx="7.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="720.0" y="212" font-size="12" text-anchor="middle" fill="#000">Tagged table 0</text>
<text x="720.0" y="226" font-size="12" text-anchor="middle" fill="#000">1024 entries, history 5</text>
<rect x="540" y="250" width="360" height="50" rx="7.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="720.0" y="272" font-size="12" text-anchor="middle" fill="#000">Tagged table 1</text>
<text x="720.0" y="286" font-size="12" text-anchor="middle" fill="#000">1024 entries, history 12</text>
<rect x="540" y="310" width="360" height="50" rx="7.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="720.0" y="332" font-size="12" text-anchor="middle" fill="#000">Tagged table 2</text>
<text x="720.0" y="346" font-size="12" text-anchor="middle" fill="#000">1024 entries, history 28</text>
<rect x="920" y="190" width="380" height="50" rx="7.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1110.0" y="212" font-size="12" text-anchor="middle" fill="#000">Tagged table 3</text>
<text x="1110.0" y="226" font-size="12" text-anchor="middle" fill="#000">1024 entries, history 64</text>
<rect x="920" y="250" width="380" height="110" rx="16.5" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="1110.0" y="286" font-size="12" text-anchor="middle" fill="#000">Entry word</text>
<text x="1110.0" y="302" font-size="12" text-anchor="middle" fill="#000">tag, prediction counters, useful bits, valid bit</text>
<text x="1110.0" y="316" font-size="12" text-anchor="middle" fill="#000">the valid bit lives in the RAM word;</text>
<text x="1110.0" y="332" font-size="12" text-anchor="middle" fill="#000">a post-reset sweep clears it (256 or 512 cycles)</text>
<rect x="1400" y="110" width="360" height="90" rx="13.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1580.0" y="144" font-size="12" text-anchor="middle" fill="#000">Provider select</text>
<text x="1580.0" y="159" font-size="12" text-anchor="middle" fill="#000">longest matching history wins;</text>
<text x="1580.0" y="174" font-size="12" text-anchor="middle" fill="#000">tables walked in ascending order</text>
<rect x="1400" y="220" width="360" height="80" rx="12.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1580.0" y="249" font-size="12" text-anchor="middle" fill="#000">alt_pred and alloc_table</text>
<text x="1580.0" y="264" font-size="12" text-anchor="middle" fill="#000">what the previous provider would say;</text>
<text x="1580.0" y="279" font-size="12" text-anchor="middle" fill="#000">first table above with useful = 0</text>
<rect x="1400" y="320" width="360" height="60" rx="9.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1580.0" y="346" font-size="12" text-anchor="middle" fill="#000">pred_taken</text>
<text x="1580.0" y="362" font-size="12" text-anchor="middle" fill="#000">carried in the FTQ entry</text>
<rect x="40" y="490" width="560" height="110" rx="16.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="320.0" y="526" font-size="12" text-anchor="middle" fill="#000">Training write</text>
<text x="320.0" y="542" font-size="12" text-anchor="middle" fill="#000">allocation policy is fixed at prediction time,</text>
<text x="320.0" y="556" font-size="12" text-anchor="middle" fill="#000">so training is a direct RAM write, not a second read;</text>
<text x="320.0" y="572" font-size="12" text-anchor="middle" fill="#000">the lookup history is carried in the FTQ</text>
<rect x="640" y="490" width="560" height="110" rx="16.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="920.0" y="526" font-size="12" text-anchor="middle" fill="#000">Useful-bit decay</text>
<text x="920.0" y="542" font-size="12" text-anchor="middle" fill="#000">a counter ticks on every training update;</text>
<text x="920.0" y="556" font-size="12" text-anchor="middle" fill="#000">on overflow a sweep walks every index</text>
<text x="920.0" y="572" font-size="12" text-anchor="middle" fill="#000">clearing one useful bit</text>
<rect x="1240" y="490" width="500" height="110" rx="16.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="1490.0" y="526" font-size="12" text-anchor="middle" fill="#000">History recovery</text>
<text x="1490.0" y="542" font-size="12" text-anchor="middle" fill="#000">commit sets recover_history only when execute has not;</text>
<text x="1490.0" y="556" font-size="12" text-anchor="middle" fill="#000">ghr_cp in the FTQ restores an exact history</text>
<text x="1490.0" y="572" font-size="12" text-anchor="middle" fill="#000">including slot 0&#x27;s speculative outcome in slot 1</text>
<rect x="40" y="630" width="1700" height="100" rx="15.0" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="890.0" y="662" font-size="12" text-anchor="middle" fill="#000">Why this size</text>
<text x="890.0" y="676" font-size="12" text-anchor="middle" fill="#000">a CoreMark sweep of tables, entries and histories picked four 1024-entry tables with histories 5, 12, 28, 64; mispredicts fell from 13,714 to 7,873,</text>
<text x="890.0" y="692" font-size="12" text-anchor="middle" fill="#000">TAGE direction accuracy rose from 97.75% to 98.86%, and a 128-bit history was ruled out because it would double the history checkpoint</text>
<text x="890.0" y="706" font-size="12" text-anchor="middle" fill="#000">held in every FTQ entry, which sits on a critical path</text>
<text x="30" y="784" font-size="10" fill="#333">Index and tag are folded history XOR PC bits. The folds are registered, so a lookup has no wide XOR tree in front of the RAM address.</text></svg>