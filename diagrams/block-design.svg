<text x="1505.0" y="792" font-size="12" text-anchor="middle" fill="#000">SoC fabric and memory</text>
<text x="1505.0" y="806" font-size="12" text-anchor="middle" fill="#000">see the SoC diagram</text>
<text x="40" y="780" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Control signals</text>
<text x="40" y="805" font-size="11" text-anchor="start" fill="#000">recovery: execute-time mispredict, selective kill of younger work</text>
<text x="40" y="825" font-size="11" text-anchor="start" fill="#000">flush / full_flush: commit, trap, MRET, FENCE.I; full_flush also wipes rename, ROB and queues</text>
<text x="40" y="845" font-size="11" text-anchor="start" fill="#000">store token: the ROB authorizes a store (an atomic only at the head); the LSQ issues it the next cycle</text>
<text x="40" y="865" font-size="11" text-anchor="start" fill="#000">retire ids: commit frees physical registers and load queue entries</text>
<text x="30" y="924" font-size="10" fill="#333">Solid arrows: instruction and data flow. Dashed arrows: control and redirects. File names are under rtl/cpu/ in the design repository.</text></svg>