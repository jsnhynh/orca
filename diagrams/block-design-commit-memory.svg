<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 780" width="1800" height="780" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke" stroke="context-stroke"/></marker></defs>
<rect width="1800" height="780" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#000">Commit, traps and the L1 caches</text>
<rect x="20" y="70" width="880" height="460" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="28" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">ROB and commit (stage 8)</text>
<rect x="940" y="70" width="440" height="460" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="948" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">Traps and CSRs</text>
<rect x="1420" y="70" width="360" height="460" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="1428" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">Data memory</text>
<rect x="20" y="570" width="1760" height="160" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="28" y="586" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">L1 subsystem and backing port</text>
<path d="M165,410 L165,440" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M435,410 L435,440" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M730,410 L730,440" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M880,355 L910,355 L910,165 L960,165" fill="none" stroke="#d6b656" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#a)"/>
<path d="M1160,220 L1160,250" fill="none" stroke="#d6b656" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#a)"/>
<path d="M960,445 L930,445 L930,175 L960,175" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#a)"/>
<path d="M1600,170 L1600,200" fill="none" stroke="#d79b00" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1600,260 L1600,290" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1600,370 L1600,400" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1600,510 L1600,540 L1100,540 L1100,610" fill="none" stroke="#82b366" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M230,610 L230,550 L1100,550 L1100,610" fill="none" stroke="#82b366" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1280,660 L1310,660" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M890,660 L920,660" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#a)"/>
<text x="905" y="303" font-size="10" text-anchor="middle" fill="#000" stroke="#fff" stroke-width="4" paint-order="stroke">trap, MRET</text>
<rect x="40" y="110" width="260" height="70" rx="10.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="170.0" y="134" font-size="12" text-anchor="middle" fill="#000">rob_status</text>
<text x="170.0" y="149" font-size="12" text-anchor="middle" fill="#000">3 bits per entry:</text>
<text x="170.0" y="164" font-size="12" text-anchor="middle" fill="#000">valid, ready, exception</text>
<rect x="320" y="110" width="270" height="70" rx="10.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="455.0" y="134" font-size="12" text-anchor="middle" fill="#000">result_storage</text>
<text x="455.0" y="149" font-size="12" text-anchor="middle" fill="#000">32-bit branch outcome:</text>
<text x="455.0" y="164" font-size="12" text-anchor="middle" fill="#000">taken bit and target</text>
<rect x="610" y="110" width="270" height="70" rx="10.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="745.0" y="142" font-size="12" text-anchor="middle" fill="#000">Payload array</text>
<text x="745.0" y="156" font-size="12" text-anchor="middle" fill="#000">106-bit retirement context</text>
<rect x="40" y="200" width="260" height="70" rx="10.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="170.0" y="232" font-size="12" text-anchor="middle" fill="#000">CSR value storage</text>
<text x="170.0" y="246" font-size="12" text-anchor="middle" fill="#000">one RAM writer, the CSR unit</text>
<rect x="320" y="200" width="270" height="70" rx="10.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="455.0" y="224" font-size="12" text-anchor="middle" fill="#000">Store flags</text>
<text x="455.0" y="239" font-size="12" text-anchor="middle" fill="#000">store_authorized_mem</text>
<text x="455.0" y="254" font-size="12" text-anchor="middle" fill="#000">head_store_complete_q</text>
<rect x="610" y="200" width="270" height="70" rx="10.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="745.0" y="224" font-size="12" text-anchor="middle" fill="#000">FENCE.I flags</text>
<text x="745.0" y="239" font-size="12" text-anchor="middle" fill="#000">head_fence_i_started_q</text>
<text x="745.0" y="254" font-size="12" text-anchor="middle" fill="#000">head_fence_i_complete_q</text>
<rect x="40" y="300" width="840" height="110" rx="16.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="460.0" y="336" font-size="12" text-anchor="middle" fill="#000">Commit logic</text>
<text x="460.0" y="352" font-size="12" text-anchor="middle" fill="#000">up to two in-order retirements per cycle; control-flow retirement serializes, one branch per cycle</text>
<text x="460.0" y="366" font-size="12" text-anchor="middle" fill="#000">a store is authorized only for the head, as a token the load/store queue registers; an atomic only at the head</text>
<text x="460.0" y="382" font-size="12" text-anchor="middle" fill="#000">FENCE.I waits for older stores to drain, then maintains both caches</text>
<rect x="40" y="440" width="250" height="70" rx="10.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="165.0" y="472" font-size="12" text-anchor="middle" fill="#000">Retire ids</text>
<text x="165.0" y="486" font-size="12" text-anchor="middle" fill="#000">free registers and load queue entries</text>
<rect x="310" y="440" width="250" height="70" rx="10.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="435.0" y="472" font-size="12" text-anchor="middle" fill="#000">Store token</text>
<text x="435.0" y="486" font-size="12" text-anchor="middle" fill="#000">to the load/store queue</text>
<rect x="580" y="440" width="300" height="70" rx="10.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="730.0" y="472" font-size="12" text-anchor="middle" fill="#000">Flush and redirect</text>
<text x="730.0" y="486" font-size="12" text-anchor="middle" fill="#000">commit_flush, arch_redirect to the BPU</text>
<rect x="960" y="110" width="400" height="110" rx="16.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1160.0" y="146" font-size="12" text-anchor="middle" fill="#000">csr.sv</text>
<text x="1160.0" y="162" font-size="12" text-anchor="middle" fill="#000">machine-mode CSR bank: mstatus, mie, mip, mtvec,</text>
<text x="1160.0" y="176" font-size="12" text-anchor="middle" fill="#000">mepc, mcause, mtval, counters; interrupt gating;</text>
<text x="1160.0" y="192" font-size="12" text-anchor="middle" fill="#000">trap and MRET redirect to direct-mode mtvec</text>
<rect x="960" y="250" width="400" height="110" rx="16.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1160.0" y="286" font-size="12" text-anchor="middle" fill="#000">Oldest-exception record (rob.sv)</text>
<text x="1160.0" y="302" font-size="12" text-anchor="middle" fill="#000">decode, ALU, AGU and LSU reports carry the ROB tag,</text>
<text x="1160.0" y="316" font-size="12" text-anchor="middle" fill="#000">cause and tval; at the head they suppress retirement</text>
<text x="1160.0" y="332" font-size="12" text-anchor="middle" fill="#000">and side effects, then flush speculative state</text>
<rect x="960" y="390" width="400" height="110" rx="16.5" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="1160.0" y="426" font-size="12" text-anchor="middle" fill="#000">Interrupt sources</text>
<text x="1160.0" y="442" font-size="12" text-anchor="middle" fill="#000">machine timer, software, external (UART, test source)</text>
<text x="1160.0" y="456" font-size="12" text-anchor="middle" fill="#000">from the SoC; taken at commit, and they wait while</text>
<text x="1160.0" y="472" font-size="12" text-anchor="middle" fill="#000">a store or atomic is authorized</text>
<rect x="1440" y="110" width="320" height="60" rx="9.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="1600.0" y="136" font-size="12" text-anchor="middle" fill="#000">Load/store queues</text>
<text x="1600.0" y="152" font-size="12" text-anchor="middle" fill="#000">12 + 12</text>
<rect x="1440" y="200" width="320" height="60" rx="9.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1600.0" y="226" font-size="12" text-anchor="middle" fill="#000">LSU</text>
<text x="1600.0" y="242" font-size="12" text-anchor="middle" fill="#000">memory issue, forwarding, atomics</text>
<rect x="1440" y="290" width="320" height="80" rx="12.0" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="1600.0" y="319" font-size="12" text-anchor="middle" fill="#000">dmem_router</text>
<text x="1600.0" y="334" font-size="12" text-anchor="middle" fill="#000">cacheable to the D-cache</text>
<text x="1600.0" y="349" font-size="12" text-anchor="middle" fill="#000">MMIO and DMA to uncached AXI</text>
<rect x="1440" y="400" width="320" height="110" rx="16.5" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="1600.0" y="444" font-size="12" text-anchor="middle" fill="#000">D-cache (cache.sv)</text>
<text x="1600.0" y="459" font-size="12" text-anchor="middle" fill="#000">16 KiB, 2-way, 64-byte lines, write-back</text>
<text x="1600.0" y="474" font-size="12" text-anchor="middle" fill="#000">data RAM: four 32-bit beat banks per way</text>
<rect x="40" y="610" width="380" height="100" rx="15.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="230.0" y="649" font-size="12" text-anchor="middle" fill="#000">I-cache (icache.sv)</text>
<text x="230.0" y="664" font-size="12" text-anchor="middle" fill="#000">16 KiB, 2-way, 64-byte lines, 64-bit data banks</text>
<text x="230.0" y="679" font-size="12" text-anchor="middle" fill="#000">tag RAM per way, valid and replacement bits in flops</text>
<rect x="450" y="610" width="440" height="100" rx="15.0" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="670.0" y="649" font-size="12" text-anchor="middle" fill="#000">cpu_l1_subsystem</text>
<text x="670.0" y="664" font-size="12" text-anchor="middle" fill="#000">FENCE.I sequencing: drain, write back, invalidate both</text>
<text x="670.0" y="679" font-size="12" text-anchor="middle" fill="#000">4-entry FIFO of accepted I-cache request addresses</text>
<rect x="920" y="610" width="360" height="100" rx="15.0" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="1100.0" y="649" font-size="12" text-anchor="middle" fill="#000">cache_arbiter</text>
<text x="1100.0" y="664" font-size="12" text-anchor="middle" fill="#000">shares one 128-bit backing line port</text>
<text x="1100.0" y="679" font-size="12" text-anchor="middle" fill="#000">instruction traffic wins ties</text>
<rect x="1310" y="610" width="440" height="100" rx="15.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1530.0" y="656" font-size="12" text-anchor="middle" fill="#000">Line port and uncached AXI</text>
<text x="1530.0" y="672" font-size="12" text-anchor="middle" fill="#000">to the SoC memory and fabric</text>
<text x="30" y="764" font-size="10" fill="#333">The ROB holds one record per instruction across several arrays, because each field has a different writer and timing.</text></svg>