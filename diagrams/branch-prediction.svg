<rect x="40" y="250" width="200" height="50" rx="7.5" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="140.0" y="272" font-size="12" text-anchor="middle" fill="#000">3 Execute recovery</text>
