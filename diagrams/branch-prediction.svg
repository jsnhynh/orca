<text x="1400.0" y="174" font-size="12" text-anchor="middle" fill="#000">agrees with L0: continue</text>
<text x="1400.0" y="189" font-size="12" text-anchor="middle" fill="#000">differs: hold one cycle</text>
<rect x="1290" y="250" width="220" height="70" rx="10.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1400.0" y="282" font-size="12" text-anchor="middle" fill="#000">Prediction metadata</text>
<text x="1400.0" y="296" font-size="12" text-anchor="middle" fill="#000">provider, alternate, strength</text>
<rect x="1540" y="120" width="220" height="100" rx="15.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="1650.0" y="159" font-size="12" text-anchor="middle" fill="#000">Repair</text>
<text x="1650.0" y="174" font-size="12" text-anchor="middle" fill="#000">pred_hold, registered redirect</text>
<text x="1650.0" y="189" font-size="12" text-anchor="middle" fill="#000">one-cycle transaction</text>
<rect x="50" y="480" width="320" height="90" rx="13.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="210.0" y="514" font-size="12" text-anchor="middle" fill="#000">BPU alloc control</text>
<text x="210.0" y="529" font-size="12" text-anchor="middle" fill="#000">FTQ enqueue, speculative GHR</text>
<text x="210.0" y="544" font-size="12" text-anchor="middle" fill="#000">and RAS updates from the fetch packet</text>
<rect x="410" y="480" width="340" height="140" rx="21.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="580.0" y="524" font-size="12" text-anchor="middle" fill="#000">FTQ</text>
<text x="580.0" y="539" font-size="12" text-anchor="middle" fill="#000">16 entries, payload in two banks</text>
<text x="580.0" y="554" font-size="12" text-anchor="middle" fill="#000">PC, prediction, GHR checkpoint,</text>
<text x="580.0" y="569" font-size="12" text-anchor="middle" fill="#000">RAS checkpoint, return flag,</text>
<text x="580.0" y="584" font-size="12" text-anchor="middle" fill="#000">valid and recovered bits</text>
<rect x="410" y="650" width="340" height="70" rx="10.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="580.0" y="682" font-size="12" text-anchor="middle" fill="#000">Return-pending flag</text>
<text x="580.0" y="696" font-size="12" text-anchor="middle" fill="#000">registered; selects RAS bypass</text>
<rect x="850" y="480" width="280" height="100" rx="15.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="990.0" y="512" font-size="12" text-anchor="middle" fill="#000">Execute recover</text>
<text x="990.0" y="526" font-size="12" text-anchor="middle" fill="#000">ALU branch result against the FTQ entry</text>
<text x="990.0" y="542" font-size="12" text-anchor="middle" fill="#000">oldest by circular distance from the</text>
<text x="990.0" y="556" font-size="12" text-anchor="middle" fill="#000">ROB head raises recovery (3)</text>
<rect x="1160" y="480" width="280" height="100" rx="15.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1300.0" y="512" font-size="12" text-anchor="middle" fill="#000">Commit control</text>
<text x="1300.0" y="526" font-size="12" text-anchor="middle" fill="#000">compares the architectural outcome</text>
<text x="1300.0" y="542" font-size="12" text-anchor="middle" fill="#000">with the FTQ entry; raises commit_flush (2);</text>
<text x="1300.0" y="556" font-size="12" text-anchor="middle" fill="#000">counts performance events</text>
<rect x="1470" y="480" width="280" height="100" rx="15.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1610.0" y="519" font-size="12" text-anchor="middle" fill="#000">Training writes</text>
<text x="1610.0" y="534" font-size="12" text-anchor="middle" fill="#000">BTB, TAGE and L0 BTB</text>
<text x="1610.0" y="549" font-size="12" text-anchor="middle" fill="#000">at commit only, never at execute</text>
<rect x="850" y="620" width="590" height="90" rx="13.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="1145.0" y="654" font-size="12" text-anchor="middle" fill="#000">flush and full_flush</text>
<text x="1145.0" y="669" font-size="12" text-anchor="middle" fill="#000">flush: commit, execute recovery, architectural redirect</text>
<text x="1145.0" y="684" font-size="12" text-anchor="middle" fill="#000">full_flush (commit and architectural only) also wipes rename and the ROB</text>
<text x="30" y="784" font-size="10" fill="#333">Solid arrows: prediction and training data. Dashed arrows: redirects and repair. Redirect priority runs from 1 (highest) to 4.</text></svg>