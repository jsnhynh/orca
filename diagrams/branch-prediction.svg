<text x="750.0" y="146" font-size="12" text-anchor="middle" fill="#000">BTB</text>
<text x="750.0" y="162" font-size="12" text-anchor="middle" fill="#000">512 entries, banked BRAM</text>
<rect x="650" y="195" width="200" height="50" rx="7.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="750.0" y="216" font-size="12" text-anchor="middle" fill="#000">TAGE base</text>
<text x="750.0" y="232" font-size="12" text-anchor="middle" fill="#000">512 bimodal</text>
<rect x="880" y="120" width="270" height="130" rx="19.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1015.0" y="166" font-size="12" text-anchor="middle" fill="#000">TAGE tagged tables</text>
<text x="1015.0" y="182" font-size="12" text-anchor="middle" fill="#000">4 x 1024 entries</text>
<text x="1015.0" y="196" font-size="12" text-anchor="middle" fill="#000">history lengths 5, 12, 28, 64</text>
<text x="1015.0" y="212" font-size="12" text-anchor="middle" fill="#000">valid bit stored in the RAM word</text>
<rect x="650" y="270" width="200" height="60" rx="9.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="750.0" y="296" font-size="12" text-anchor="middle" fill="#000">RAS</text>
<text x="750.0" y="312" font-size="12" text-anchor="middle" fill="#000">16 entries, speculative top</text>
<rect x="880" y="270" width="270" height="60" rx="9.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1015.0" y="296" font-size="12" text-anchor="middle" fill="#000">Global history</text>
<text x="1015.0" y="312" font-size="12" text-anchor="middle" fill="#000">64 bits, speculative + retained</text>
