<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" width="1800" height="700" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke" stroke="context-stroke"/></marker></defs>
<rect width="1800" height="700" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#000">Front end, cycle by cycle</text>
<rect x="20" y="70" width="430" height="520" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="28" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">F1: cycle 0</text>
<rect x="470" y="70" width="430" height="520" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="478" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">F2: cycle 1</text>
<rect x="920" y="70" width="520" height="520" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="928" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">F3: cycle 2</text>
<rect x="1480" y="70" width="300" height="520" rx="18" fill="#f5f5f5" fill-opacity="0.5" stroke="#666" stroke-opacity="0.5"/>
<text x="1488" y="86" font-size="11" font-weight="bold" fill="#333" fill-opacity="0.7">D: cycle 3</text>
<path d="M135,290 L135,275 L135,260" fill="none" stroke="#6c8ebf" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M340,260 L340,275 L340,290" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M240,260 L240,372 L240,390" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M430,325 L450,325 L470,325 L470,160 L490,160" fill="none" stroke="#82b366" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M430,425 L450,425 L470,425 L470,280 L490,280" fill="none" stroke="#6c8ebf" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M685,320 L685,350" fill="none" stroke="#6c8ebf" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M685,210 L685,450" fill="none" stroke="#82b366" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M880,385 L900,385 L920,385 L920,145 L940,145" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1170,145 L1190,145" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1055,180 L1055,210" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1305,180 L1305,210" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1055,300 L1055,330" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1305,300 L1305,330" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1170,375 L1190,375" fill="none" stroke="#d79b00" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1420,145 L1440,145 L1440,500 L1420,500" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1420,375 L1434,375 A6,6 0 0 1 1446,375 L1460,375 L1460,160 L1500,160" fill="none" stroke="#d79b00" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M1630,210 L1630,240" fill="none" stroke="#d6b656" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="110" width="390" height="150" rx="22.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="235.0" y="152" font-size="12" text-anchor="middle" fill="#000">Request launch (priority order)</text>
<text x="235.0" y="166" font-size="12" text-anchor="middle" fill="#000">1 pred_redirect_val: L1 repair</text>
<text x="235.0" y="182" font-size="12" text-anchor="middle" fill="#000">2 flush_pending_q: latched redirect</text>
<text x="235.0" y="196" font-size="12" text-anchor="middle" fill="#000">3 startup_q: reset PC</text>
<text x="235.0" y="212" font-size="12" text-anchor="middle" fill="#000">4 next_req_pending_q: deferred successor</text>
<text x="235.0" y="226" font-size="12" text-anchor="middle" fill="#000">5 pc_req_next: fallthrough or L0 target</text>
<rect x="40" y="290" width="190" height="70" rx="10.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="135.0" y="322" font-size="12" text-anchor="middle" fill="#000">L0 BTB lookup</text>
<text x="135.0" y="336" font-size="12" text-anchor="middle" fill="#000">same-cycle target</text>
<rect x="250" y="290" width="180" height="70" rx="10.5" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="340.0" y="322" font-size="12" text-anchor="middle" fill="#000">I-cache request</text>
<text x="340.0" y="336" font-size="12" text-anchor="middle" fill="#000">tag and data RAM address</text>
<rect x="40" y="390" width="390" height="70" rx="10.5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="235.0" y="422" font-size="12" text-anchor="middle" fill="#000">BTB, TAGE and RAS request</text>
<text x="235.0" y="436" font-size="12" text-anchor="middle" fill="#000">same fetch address and history</text>
<rect x="40" y="490" width="390" height="70" rx="10.5" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="235.0" y="522" font-size="12" text-anchor="middle" fill="#000">Two instructions per request</text>
<text x="235.0" y="536" font-size="12" text-anchor="middle" fill="#000">aligned to an 8-byte group; pc[2] set gives one valid lane</text>
<rect x="490" y="110" width="390" height="100" rx="15.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="685.0" y="149" font-size="12" text-anchor="middle" fill="#000">I-cache SRAM read</text>
<text x="685.0" y="164" font-size="12" text-anchor="middle" fill="#000">2 ways, 64-bit data banks, tag RAM per way</text>
<text x="685.0" y="179" font-size="12" text-anchor="middle" fill="#000">tag compare and way select on the RAM outputs</text>
<rect x="490" y="240" width="390" height="80" rx="12.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="685.0" y="276" font-size="12" text-anchor="middle" fill="#000">BTB, TAGE and RAS read</text>
<text x="685.0" y="292" font-size="12" text-anchor="middle" fill="#000">synchronous reads, one cycle</text>
<rect x="490" y="350" width="390" height="70" rx="10.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="685.0" y="374" font-size="12" text-anchor="middle" fill="#000">pipe_resp register</text>
<text x="685.0" y="389" font-size="12" text-anchor="middle" fill="#000">collects the cache response, lane valids</text>
<text x="685.0" y="404" font-size="12" text-anchor="middle" fill="#000">and the table outputs</text>
<rect x="490" y="450" width="390" height="100" rx="15.0" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="685.0" y="489" font-size="12" text-anchor="middle" fill="#000">I-cache miss</text>
<text x="685.0" y="504" font-size="12" text-anchor="middle" fill="#000">starts a refill of four 128-bit beats</text>
<text x="685.0" y="519" font-size="12" text-anchor="middle" fill="#000">the requester replays the request</text>
<rect x="940" y="110" width="230" height="70" rx="10.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1055.0" y="142" font-size="12" text-anchor="middle" fill="#000">Response accept</text>
<text x="1055.0" y="156" font-size="12" text-anchor="middle" fill="#000">hold register empty or released</text>
<rect x="1190" y="110" width="230" height="70" rx="10.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1305.0" y="142" font-size="12" text-anchor="middle" fill="#000">Predecode</text>
<text x="1305.0" y="156" font-size="12" text-anchor="middle" fill="#000">branch, JAL, JALR, call, return</text>
<rect x="940" y="210" width="230" height="90" rx="13.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1055.0" y="244" font-size="12" text-anchor="middle" fill="#000">L1 verdict</text>
<text x="1055.0" y="259" font-size="12" text-anchor="middle" fill="#000">agrees with L0: continue</text>
<text x="1055.0" y="274" font-size="12" text-anchor="middle" fill="#000">differs: hold one cycle, repair</text>
<rect x="1190" y="210" width="230" height="90" rx="13.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1305.0" y="244" font-size="12" text-anchor="middle" fill="#000">Lane scrub</text>
<text x="1305.0" y="259" font-size="12" text-anchor="middle" fill="#000">removes the younger lane when</text>
<text x="1305.0" y="274" font-size="12" text-anchor="middle" fill="#000">slot 0 ends the packet</text>
<rect x="940" y="330" width="230" height="90" rx="13.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="1055.0" y="364" font-size="12" text-anchor="middle" fill="#000">Hold register</text>
<text x="1055.0" y="379" font-size="12" text-anchor="middle" fill="#000">one packet, one cycle</text>
<text x="1055.0" y="394" font-size="12" text-anchor="middle" fill="#000">imem_rec_rdy drops while held</text>
<rect x="1190" y="330" width="230" height="90" rx="13.5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="1305.0" y="372" font-size="12" text-anchor="middle" fill="#000">Instruction buffer</text>
<text x="1305.0" y="386" font-size="12" text-anchor="middle" fill="#000">4 entries, FIFO</text>
<rect x="940" y="450" width="480" height="100" rx="15.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1180.0" y="489" font-size="12" text-anchor="middle" fill="#000">FTQ allocation (BPU alloc control)</text>
<text x="1180.0" y="504" font-size="12" text-anchor="middle" fill="#000">one FTQ entry per fetch packet with GHR and RAS checkpoints;</text>
<text x="1180.0" y="519" font-size="12" text-anchor="middle" fill="#000">speculative history and RAS updated from predecode</text>
<rect x="1500" y="110" width="260" height="100" rx="15.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1630.0" y="149" font-size="12" text-anchor="middle" fill="#000">Decode register</text>
<text x="1630.0" y="164" font-size="12" text-anchor="middle" fill="#000">2 decoders</text>
<text x="1630.0" y="179" font-size="12" text-anchor="middle" fill="#000">legality check, immediates</text>
<rect x="1500" y="240" width="260" height="80" rx="12.0" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="1630.0" y="276" font-size="12" text-anchor="middle" fill="#000">Rename (cycle 4)</text>
<text x="1630.0" y="292" font-size="12" text-anchor="middle" fill="#000">next stage</text>
<text x="30" y="684" font-size="10" fill="#333">Cycle numbers are relative to the I-cache request. File names are under rtl/cpu/ in the design repository.</text></svg>