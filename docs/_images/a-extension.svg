<text x="680.0" y="532" font-size="11" text-anchor="middle" fill="#000">valid, word address</text>
<rect x="880" y="480" width="240" height="80" rx="12.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1000.0" y="509" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">AMO ALU</text>
<text x="1000.0" y="524" font-size="11" text-anchor="middle" fill="#000">swap, add, xor, and, or,</text>
<text x="1000.0" y="539" font-size="11" text-anchor="middle" fill="#000">min, max (signed, unsigned)</text>
<rect x="1200" y="480" width="240" height="80" rx="12.0" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="1320.0" y="516" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">Result register</text>
<text x="1320.0" y="532" font-size="11" text-anchor="middle" fill="#000">old value, then CDB</text>
<text x="40" y="640" font-size="9" text-anchor="start" fill="#000">Only word atomics (funct3 = W). aq and rl are carried and ignored.</text>
<text x="40" y="660.0" font-size="9" text-anchor="start" fill="#000">The cache sees the read and the write as two ordinary accesses; the sequencer holds the line between them.</text>
<text x="30" y="744" font-size="10" fill="#333">Atomics wait at the ROB head, then the sequencer runs a read, an ALU step and a write on the cache port. LR sets a reservation; SC checks it. An atomic entry never forwards to loads.</text></svg>